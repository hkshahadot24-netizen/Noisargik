name: Update Firebase Product Sitemap

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sitemap from Firebase
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes."
            exit 0
          fi

          git commit -m "Update product sitemap"
          git push
